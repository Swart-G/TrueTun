name: truetun
description: Cross-platform Android and Linux proxy client.
publish_to: none
version: 0.4.0+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  drift: ^2.28.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.39
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
