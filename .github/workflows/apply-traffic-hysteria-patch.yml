name: Apply traffic and Hysteria2 patch

on:
  push:
    branches:
      - fix/traffic-hysteria2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_patch.py
          python3 /tmp/apply_patch.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore traffic metrics and add Hysteria2 profiles'
          git push origin HEAD:fix/traffic-hysteria2
