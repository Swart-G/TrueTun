name: TrueTun Stable Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

env:
  TRUETUN_VERSION: 0.4.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev curl sudo policykit-1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify sources and tests
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Linux release bundle
        run: bash tool/package_linux_release.sh

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/TrueTun-android-v${TRUETUN_VERSION}.apk"
          cp "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz" release-assets/
          curl --fail --location --silent --show-error \
            https://github.com/Leadaxe/sing-box-lx/archive/refs/tags/v1.14.0-lx.35.tar.gz \
            --output release-assets/sing-box-lx-1.14.0-lx.35-source.tar.gz
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cd release-assets
          sha256sum \
            "TrueTun-android-v${TRUETUN_VERSION}.apk" \
            "TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz" \
            sing-box-lx-1.14.0-lx.35-source.tar.gz \
            > SHA256SUMS.txt

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${TRUETUN_VERSION}" >/dev/null 2>&1; then
            echo "Release v${TRUETUN_VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## TrueTun 0.4.0

          First combined Android + Linux stable GitHub release.

          ### Android
          - Real Android `VpnService` and TUN backed by pinned `sing-box-lx 1.14.0-lx.35` libbox.
          - VLESS/Reality, XHTTP and Hysteria2 connection paths.
          - Subscriptions, persistence, ordered routing and per-app whitelist/blacklist routing.
          - Foreground VPN service, native state/traffic events and optimized traffic graph.
          - Fix for the Flutter dialog lifecycle crash found during beta device testing.

          ### Linux x86_64
          - Release-mode Flutter desktop bundle with pinned XHTTP-capable sing-box-lx.
          - TUN through a narrow privileged helper while the GUI stays unprivileged.
          - Profiles/subscriptions, traffic, logs, tray and autostart.
          - Ordered domain/IP/port/protocol routing plus Linux process-name/path/regex rules.
          - Desktop-menu installer and cleanup helper included.

          ### Integrity and source
          `SHA256SUMS.txt` covers the Android APK, Linux archive and attached sing-box-lx corresponding-source archive. `THIRD_PARTY_NOTICES.md` records exact runtime provenance.

          ### Installation
          **Android:** install `TrueTun-android-v0.4.0.apk`. This GitHub build uses the project's test signing key unless a production keystore is supplied to the Gradle build.

          **Linux:** unpack `TrueTun-linux-x86_64-v0.4.0.tar.gz` and run `./truetun`. The first launch uses PolicyKit once to prepare the privileged TUN helper. `./install-desktop.sh` adds the application-menu entry; `./uninstall.sh` removes desktop/autostart integration and the privileged helper.

          CI validates Flutter analysis/tests and builds both release artifacts. Runtime network behavior can still depend on the Android vendor kernel, Linux distribution, firewall, DNS and network policy.
          EOF

          gh release create "v${TRUETUN_VERSION}" \
            release-assets/TrueTun-android-v${TRUETUN_VERSION}.apk \
            release-assets/TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz \
            release-assets/sing-box-lx-1.14.0-lx.35-source.tar.gz \
            release-assets/SHA256SUMS.txt \
            release-assets/THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --title "TrueTun ${TRUETUN_VERSION}" \
            --notes-file release-notes.md \
            --latest
