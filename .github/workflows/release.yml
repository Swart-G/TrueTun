name: TrueTun Stable Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

env:
  TRUETUN_VERSION: 0.4.0

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TRUETUN_KEYSTORE_PATH: ${{ runner.temp }}/truetun-release.jks
      TRUETUN_KEYSTORE_BASE64: ${{ secrets.TRUETUN_KEYSTORE_BASE64 }}
      TRUETUN_KEYSTORE_PASSWORD: ${{ secrets.TRUETUN_KEYSTORE_PASSWORD }}
      TRUETUN_KEY_ALIAS: ${{ secrets.TRUETUN_KEY_ALIAS }}
      TRUETUN_KEY_PASSWORD: ${{ secrets.TRUETUN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Dart and Flutter tests
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Prepare optional production Android signing key
        run: |
          if [[ -n "${TRUETUN_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$TRUETUN_KEYSTORE_BASE64" | base64 --decode > "$TRUETUN_KEYSTORE_PATH"
          fi
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Prepare Android asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/TrueTun-android-v${TRUETUN_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/TrueTun-android-v${{ env.TRUETUN_VERSION }}.apk
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev curl sudo policykit-1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux release bundle
        run: bash tool/package_linux_release.sh
      - name: Smoke-check Linux bundle
        run: |
          test -x "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}/truetun"
          test -x "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}/truetun-bin"
          test -x "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}/sing-box"
          "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}/sing-box" version
          ldd "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}/truetun-bin"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/TrueTun-linux-x86_64-v${{ env.TRUETUN_VERSION }}.tar.gz
          if-no-files-found: error

  release:
    needs:
      - android
      - linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: release-assets
      - name: Add corresponding sing-box-lx source
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Leadaxe/sing-box-lx/archive/refs/tags/v1.14.0-lx.35.tar.gz \
            --output release-assets/sing-box-lx-1.14.0-lx.35-source.tar.gz
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cd release-assets
          sha256sum \
            "TrueTun-android-v${TRUETUN_VERSION}.apk" \
            "TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz" \
            sing-box-lx-1.14.0-lx.35-source.tar.gz \
            > SHA256SUMS.txt
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${TRUETUN_VERSION}" >/dev/null 2>&1; then
            echo "Release v${TRUETUN_VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## TrueTun 0.4.0

          First combined Android + Linux stable GitHub release.

          ### Android
          - Real Android `VpnService` and TUN path backed by pinned `sing-box-lx 1.14.0-lx.35` libbox.
          - VLESS/Reality, XHTTP and Hysteria2 connection paths.
          - Subscriptions, profile selection and persistence.
          - Ordered proxy/direct/block routing rules.
          - Per-app whitelist/blacklist routing and local smart-selection suggestions.
          - Foreground VPN notification, service-owned state and Android VPN settings integration.
          - Optimized traffic graph/state subscriptions and the dialog lifecycle fix from the beta device tests.

          ### Linux x86_64
          - Release-mode Flutter desktop bundle with the same pinned XHTTP-capable sing-box-lx core family.
          - TUN connection through a root-owned, narrowly scoped helper while the GUI stays unprivileged.
          - Profiles/subscriptions, live traffic, logs, tray mode and autostart.
          - Full ordered routing editor including Linux process-name/path/regex matchers.
          - Dedicated process-routing page for quickly proxying, bypassing or blocking a process.
          - Desktop-menu installer and cleanup/uninstall helper included in the archive.

          ### Integrity and source
          `SHA256SUMS.txt` covers both application artifacts and the attached sing-box-lx source archive. `THIRD_PARTY_NOTICES.md` records the exact runtime tag, source revision and binary digests.

          ### Installation
          **Android:** install `TrueTun-android-v0.4.0.apk`. GitHub builds use the project test signing key unless repository production-signing secrets are configured; this does not affect VPN functionality, but Play/store distribution should use the production key.

          **Linux:** unpack `TrueTun-linux-x86_64-v0.4.0.tar.gz`, then run `./truetun`. The first launch uses PolicyKit once to prepare the privileged TUN helper. Run `./install-desktop.sh` for an application-menu entry and `./uninstall.sh` to remove desktop/autostart integration and the privileged helper.

          This release is built and tested in CI. Physical network behaviour can still vary by Android vendor kernel, Linux distribution, local firewall and network policy; report reproducible failures with the Logs/diagnostic information.
          EOF

          gh release create "v${TRUETUN_VERSION}" \
            release-assets/TrueTun-android-v${TRUETUN_VERSION}.apk \
            release-assets/TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz \
            release-assets/sing-box-lx-1.14.0-lx.35-source.tar.gz \
            release-assets/SHA256SUMS.txt \
            release-assets/THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --title "TrueTun ${TRUETUN_VERSION}" \
            --notes-file release-notes.md \
            --latest
