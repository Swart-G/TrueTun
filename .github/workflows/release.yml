name: TrueTun Stable Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

env:
  TRUETUN_VERSION: 0.4.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev libayatana-appindicator3-dev \
            curl sudo policykit-1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify sources and tests
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Linux release bundle
        run: bash tool/package_linux_release.sh

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/TrueTun-android-v${TRUETUN_VERSION}.apk"
          cp "dist/TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz" release-assets/
          curl --fail --location --silent --show-error \
            https://github.com/Leadaxe/sing-box-lx/archive/refs/tags/v1.14.0-lx.35.tar.gz \
            --output release-assets/sing-box-lx-1.14.0-lx.35-source.tar.gz
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cd release-assets
          sha256sum \
            "TrueTun-android-v${TRUETUN_VERSION}.apk" \
            "TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz" \
            sing-box-lx-1.14.0-lx.35-source.tar.gz \
            > SHA256SUMS.txt

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${TRUETUN_VERSION}" >/dev/null 2>&1; then
            echo "Release v${TRUETUN_VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## TrueTun 0.4.1

          Routing and browser speed-test reliability update for Android and Linux.

          ### Android
          - Added a separate routing-mode switch and Proxy, Direct or Block fallback for unmatched traffic.
          - Reworked rule creation into condition type → parameter → add, including domains, IP/CIDR, ports, protocols and Android packages.
          - Added traffic sniffing so domain suffix rules such as `.ru` can match HTTP Host, TLS SNI and QUIC SNI from TUN traffic.
          - Improved browser speed-test compatibility by making broken QUIC attempts fall back promptly to TCP/HTTPS.
          - Added an actual in-app download/upload speed test with latency reporting.
          - Fixed the traffic chart to a 16 MiB/s scale and 60-sample window, removed the grid and smoothed the lines.

          ### Linux x86_64
          - Added the same routing-mode switch, unmatched-traffic action and condition-based rule editor.
          - Added domain sniffing and browser speed-test reliability fixes shared with Android.
          - Added the real download/upload speed test and fixed-scale smoothed traffic chart.
          - Linux process-name, process-path and regex matchers remain available in the rule editor.

          ### Integrity and source
          `SHA256SUMS.txt` covers the Android APK, Linux archive and attached sing-box-lx corresponding-source archive. `THIRD_PARTY_NOTICES.md` records exact runtime provenance.

          ### Installation
          **Android:** install `TrueTun-android-v0.4.1.apk`. This GitHub build uses the project's test signing key unless a production keystore is supplied to the Gradle build.

          **Linux:** unpack `TrueTun-linux-x86_64-v0.4.1.tar.gz` and run `./truetun`. The first launch uses PolicyKit once to prepare the privileged TUN helper. `./install-desktop.sh` adds the application-menu entry; `./uninstall.sh` removes desktop/autostart integration and the privileged helper.

          CI validates Flutter analysis/tests and builds both release artifacts. Runtime network behavior can still depend on the Android vendor kernel, Linux distribution, firewall, DNS and network policy.
          EOF

          gh release create "v${TRUETUN_VERSION}" \
            release-assets/TrueTun-android-v${TRUETUN_VERSION}.apk \
            release-assets/TrueTun-linux-x86_64-v${TRUETUN_VERSION}.tar.gz \
            release-assets/sing-box-lx-1.14.0-lx.35-source.tar.gz \
            release-assets/SHA256SUMS.txt \
            release-assets/THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --title "TrueTun ${TRUETUN_VERSION}" \
            --notes-file release-notes.md \
            --latest
