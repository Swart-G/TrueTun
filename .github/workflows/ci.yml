name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: truetun-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  linux-release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev \
            liblzma-dev libsecret-1-dev libayatana-appindicator3-dev \
            curl sudo policykit-1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build self-contained Linux release bundle
        run: TRUETUN_VERSION=ci bash tool/package_linux_release.sh
      - name: Verify Linux release contents
        run: |
          test -x dist/TrueTun-linux-x86_64-vci/truetun
          test -x dist/TrueTun-linux-x86_64-vci/truetun-bin
          test -x dist/TrueTun-linux-x86_64-vci/sing-box
          test -x dist/TrueTun-linux-x86_64-vci/truetun-core-helper
          dist/TrueTun-linux-x86_64-vci/sing-box version
          ldd dist/TrueTun-linux-x86_64-vci/truetun-bin
      - name: Upload Linux release smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: truetun-linux-x86_64-release-smoke
          path: |
            dist/TrueTun-linux-x86_64-vci.tar.gz
            dist/TrueTun-linux-x86_64-vci.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
