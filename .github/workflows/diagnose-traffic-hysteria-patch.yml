name: Diagnose traffic and Hysteria2 patch

on:
  push:
    branches:
      - fix/traffic-hysteria2

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix compatibility and lint regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('lib/src/app.dart')
          content = app.read_text()
          old = """                            subtitle: Text(\n                              '${profile.node.server}:${profile.node.port} · ' +\n                                  _profileTypeLabel(profile.node),\n                            ),"""
          new = """                            subtitle: Text(\n                              '${profile.node.server}:${profile.node.port} · ${_profileTypeLabel(profile.node)}',\n                            ),"""
          if old not in content:
              raise SystemExit('Expected profile subtitle composition not found')
          app.write_text(content.replace(old, new, 1))

          state = Path('lib/src/application/app_state.dart')
          content = state.read_text()
          marker = """  void createGroup(String name) {"""
          wrapper = """  @Deprecated('Use importProfile for protocol-neutral imports')\n  void importVless(String link, {String targetGroupId = 'manual'}) {\n    importProfile(link, targetGroupId: targetGroupId);\n  }\n\n"""
          if marker not in content:
              raise SystemExit('AppController createGroup marker not found')
          if 'void importVless(' not in content:
              content = content.replace(marker, wrapper + marker, 1)
          state.write_text(content)
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate
        shell: bash
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f PATCH_DIAGNOSTICS.txt
          git add lib/src/app.dart lib/src/application/app_state.dart
          git commit -m 'fix: complete Hysteria2 validation fixes'
          git push origin HEAD:fix/traffic-hysteria2
