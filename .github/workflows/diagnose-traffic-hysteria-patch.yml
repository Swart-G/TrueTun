name: Diagnose traffic and Hysteria2 patch

on:
  push:
    branches:
      - fix/traffic-hysteria2

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and apply staged patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/apply-traffic-hysteria-patch.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d > /tmp/apply_patch.py", workflow)
          if not match:
              raise SystemExit('Unable to extract staged patch payload')
          Path('/tmp/apply_patch.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python3 /tmp/apply_patch.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture formatter diagnostics
        shell: bash
        run: |
          set +e
          dart format lib test > PATCH_DIAGNOSTICS.txt 2>&1
          status=$?
          set -e
          cat PATCH_DIAGNOSTICS.txt
          if [ "$status" -eq 0 ]; then
            echo 'Formatter succeeded.' >> PATCH_DIAGNOSTICS.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PATCH_DIAGNOSTICS.txt
          git commit -m 'chore: capture Hysteria2 patch diagnostics'
          git push origin HEAD:fix/traffic-hysteria2
          exit "$status"
