name: Android Beta Release

on:
  push:
    branches:
      - feat/android-native-vpn-runtime
    paths:
      - .github/workflows/beta-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify Dart sources
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Prepare beta assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/TrueTun-android-v0.4.0-beta.2.apk
          cd dist
          sha256sum TrueTun-android-v0.4.0-beta.2.apk > SHA256SUMS.txt

      - name: Create GitHub beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## TrueTun 0.4.0 Beta 2

          Android beta rebuilt as a release-mode APK after Beta 1 exposed a Flutter debug-only widget lifecycle assertion on a physical device.

          ### Fixes
          - Beta APK is now built with `flutter build apk --release` instead of `--debug`.
          - Added an Android UI regression test covering dialog transitions, navigation and widget-tree teardown in a tablet-sized layout.
          - Retains the native sing-box/libbox 1.14.0 VPN runtime, Android `VpnService`, TUN, app routing, routing rules, VLESS/Reality, Hysteria2 and subscriptions from Beta 1.

          ### Verification
          - `flutter analyze` must pass before publishing.
          - The complete Flutter test suite, including the Android lifecycle regression test, must pass before publishing.
          - Android release APK must compile successfully against the pinned libbox API.

          ### Beta warning
          This remains a prerelease intended for physical-device validation. Long sessions, network switching, Always-on VPN, leak behaviour and the complete transport matrix are still being validated.

          The release APK is currently signed with the project test/debug key until production signing is configured. SHA-256 is provided in `SHA256SUMS.txt`.
          EOF

          gh release create v0.4.0-beta.2 \
            dist/TrueTun-android-v0.4.0-beta.2.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "TrueTun 0.4.0 Beta 2" \
            --notes-file release-notes.md \
            --prerelease
