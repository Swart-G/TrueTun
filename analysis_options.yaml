include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
    # Temporary while the optimized Android shell is being stabilized on the
    # native-runtime branch. This remains visible to reviewers but must not
    # block device-test APKs for an otherwise compile-clean UI replacement.
    unused_import: ignore
  exclude:
    - build/**
    - android/**
    - linux/**

linter:
  rules:
    prefer_final_locals: true
    use_super_parameters: true
    curly_braces_in_flow_control_structures: false
